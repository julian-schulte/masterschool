<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>Netflix</title>
  </head>
  <body>
    <header>
      <nav>
        <div>
          <a href="#home" aria-label="Netflix home">
            <img src="netflix-logo.svg" alt="Netflix" />
          </a>
        </div>
        <div>
          <button
            id="language-select"
            href="#language"
            aria-label="Select language"
          >
            Language
          </button>
          <button href="#sign-in" aria-label="Sign in">Sign In</button>
        </div>
      </nav>
    </header>

    <main>
      <h1>
        Unlimited movies, TV <br />
        shows, and more.
      </h1>
      <h2>Starts at EUR 8.99. Cancel anytime.</h2>
      <p>
        Ready to watch? Enter your email to create or restart your membership.
      </p>
      <form>
        <input type="email" placeholder="Email address" required />
        <button type="submit">Get Started ></button>
      </form>
    </main>

    <footer></footer>
  </body>
</html>
