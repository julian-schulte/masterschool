<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="styles.css" />
      <title>Home Solutions</title>
   </head>
   <body>
    <main>
        <section id="branding">
            <img src="homes.svg" alt="House Image">
            <h1>Home Solutions</h1>
        </section>
        <section id="login">
            <h2>Log In</h2>
            <form>
                <input type="email" id="eml" name="eml" placeholder="e-mail" aria-label="E-Mail" required> 
                <input type="password" id="pw" name="pw" placeholder="password" aria-label="Password" required>
                <button type="submit" id="primary" aria-label="Log In">Log In</button>
            </form>
            <p>
                Don't have an account? <a href="#">Register</a>
            </p>
        </section>
    </main>
   </body>
</html>
